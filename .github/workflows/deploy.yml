name: deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate IPTV files
        run: |
          pnpm build
          pnpm m3u
          pnpm static
      - name: Install video inspector
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify strict 1080p domestic streams
        run: |
          python3 scripts/test-filter-1080p.py
          python3 scripts/filter-1080p.py
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: npx --yes wrangler@4.142.0 pages deploy m3u --project-name "$PROJECT_NAME" --branch main
